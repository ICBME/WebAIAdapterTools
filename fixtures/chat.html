<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture Chat</title>
</head>
<body>
  <main class="chat-shell">
    <section class="conversation" aria-live="polite">
      <article class="assistant-message">Ready.</article>
    </section>
    <form class="composer">
      <label for="prompt">Message</label>
      <textarea id="prompt" name="prompt" placeholder="Ask anything"></textarea>
      <input type="file" id="upload" name="images" aria-label="Upload image">
      <button type="submit" aria-label="Send message">Send</button>
      <button type="button" aria-label="Sign in">Sign in</button>
    </form>
  </main>
</body>
</html>
